<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>MISPLACED</title>
<style>
  :root{
    --ui-fg: rgba(230,230,225,0.85);
    --ui-dim: rgba(230,230,225,0.35);
    --ui-accent: #b3392f;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--ui-fg);
    opacity: 0.55;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.2s;
  }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 18vw 4vw rgba(0,0,0,0.75);
    mix-blend-mode: normal;
  }

  #cameraOverlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background-image: url("assets/ui/camera_overlay.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.9;
  }

  #hud {
    position: fixed; left: 22px; bottom: 20px; z-index: 10;
    color: var(--ui-dim); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; line-height: 1.8;
    pointer-events: none; user-select: none;
  }
  #hud .stamina-bar {
    width: 120px; height: 3px; background: rgba(255,255,255,0.12);
    margin-top: 4px; position: relative; overflow: hidden;
  }
  #hud .stamina-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 100%;
    background: var(--ui-fg); transition: width 0.15s linear;
  }

  #titlecard {
    position: fixed; inset: 0; z-index: 100;
    background: #050505;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ui-fg);
    transition: opacity 1.2s ease;
  }
  #titlecard h1 {
    font-weight: 300; font-size: 2.4em; letter-spacing: 0.25em;
    margin: 0 0 4px 0; color: rgba(210,205,200,0.9);
  }
  #titlecard .sub {
    font-size: 0.75em; letter-spacing: 0.35em; color: var(--ui-dim); margin-bottom: 40px;
  }
  #titlecard .prompt {
    font-size: 0.85em; letter-spacing: 0.1em; color: var(--ui-dim);
    padding: 10px 24px; border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer; transition: all 0.2s;
  }
  #titlecard .prompt:hover { border-color: var(--ui-accent); color: var(--ui-fg); }
  #titlecard .loading-status {
    margin-top: 18px; font-size: 0.7em; color: var(--ui-dim); letter-spacing: 0.1em; min-height: 1.4em;
  }
  #titlecard .barwrap {
    width: 260px; height: 2px; background: rgba(255,255,255,0.1); margin-top: 14px;
  }
  #titlecard .barfill {
    height: 100%; width: 0%; background: var(--ui-fg); transition: width 0.2s ease;
  }

  #pausehint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    color: var(--ui-dim); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.4s;
  }
  #pausehint.show { opacity: 1; }

  #errorlog {
    position: fixed; right: 12px; top: 12px; z-index: 20;
    max-width: 320px; font-size: 10px; color: #d98a7a; background: rgba(0,0,0,0.5);
    padding: 8px 10px; border-left: 2px solid #b3392f; display: none;
    font-family: monospace; line-height: 1.5; max-height: 40vh; overflow-y: auto;
  }

  #winscreen {
    position: fixed; inset: 0; z-index: 200;
    background: #050505;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ui-fg);
    opacity: 0; transition: opacity 1.4s ease;
  }
  #winscreen.show { display: flex; opacity: 1; }
  #winscreen h1 {
    font-weight: 300; font-size: 2.1em; letter-spacing: 0.22em;
    margin: 0 0 10px 0; color: rgba(210,205,200,0.9);
  }
  #winscreen .sub {
    font-size: 0.8em; letter-spacing: 0.2em; color: var(--ui-dim);
    max-width: 480px; text-align: center; line-height: 1.8;
  }

  #deathscreen {
    position: fixed; inset: 0; z-index: 200;
    background: #050505;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #b3392f;
    opacity: 0; transition: opacity 1.4s ease;
    cursor: pointer;
  }
  #deathscreen.show { display: flex; opacity: 1; }
  #deathscreen h1 {
    font-weight: 300; font-size: 2.1em; letter-spacing: 0.22em;
    margin: 0 0 10px 0; color: #c14a3c;
  }
  #deathscreen .sub {
    font-size: 0.8em; letter-spacing: 0.2em; color: var(--ui-dim);
    max-width: 480px; text-align: center; line-height: 1.8;
  }
  #deathscreen .prompt {
    margin-top: 26px; font-size: 0.75em; letter-spacing: 0.2em;
    color: var(--ui-dim); border: 1px solid rgba(255,255,255,0.15);
    padding: 10px 22px; text-transform: uppercase;
  }

  #fadeOverlay {
    position: fixed; inset: 0; z-index: 300;
    background: #000; opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
  }
  #fadeOverlay.show { opacity: 1; }

  #transitionCard {
    position: fixed; inset: 0; z-index: 301;
    display: flex; align-items: center; justify-content: center;
    color: var(--ui-fg); font-weight: 300; font-size: 1.6em;
    letter-spacing: 0.3em; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
  }
  #transitionCard.show { opacity: 1; }

  #interactPrompt {
    position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%);
    z-index: 12; color: var(--ui-fg); font-size: 12px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.35); pointer-events: none;
    opacity: 0; transition: opacity 0.25s ease;
  }
  #interactPrompt.show { opacity: 1; }

  #cheatToast {
    position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
    z-index: 302; color: var(--ui-fg); font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 10px 20px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.55); pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease;
  }
  #cheatToast.show { opacity: 1; }

  #titlecard h1.imgtitle {
    width: min(80vw, 480px);
    max-width: 480px;
    height: auto;
    object-fit: contain;
    margin: 0 0 4px 0;
  }

  /* ---------------- Mobile touch controls ---------------- */
  #touchControls {
    position: fixed; inset: 0; z-index: 15;
    pointer-events: none; display: none;
  }
  body.is-touch #touchControls { display: block; }
  body.is-touch #pausehint { display: none; }

  #touchLookZone {
    position: absolute; top: 0; right: 0; bottom: 0; left: 40%;
    pointer-events: auto;
  }

  #touchJoystickZone {
    position: absolute; left: 0; bottom: 0; top: 0; width: 40%;
    pointer-events: auto;
  }
  #joystickBase {
    position: absolute; width: 120px; height: 120px;
    left: 30px; bottom: 30px;
    background-image: url("assets/ui/joystick_base.png");
    background-size: contain; background-repeat: no-repeat;
    opacity: 0.7; pointer-events: none;
  }
  #joystickKnob {
    position: absolute; width: 56px; height: 56px;
    background-image: url("assets/ui/joystick_knob.png");
    background-size: contain; background-repeat: no-repeat;
    left: 30px; bottom: 30px;
    transform: translate(32px, -32px);
    pointer-events: none;
  }

  .touchBtn {
    position: absolute; pointer-events: auto;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    opacity: 0.75; transition: opacity 0.1s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .touchBtn.active { opacity: 1; transform: scale(0.92); }

  #btnJump {
    width: 74px; height: 74px;
    right: 28px; bottom: 130px;
    background-image: url("assets/ui/jump.png");
  }
  #btnSprint {
    width: 64px; height: 64px;
    right: 110px; bottom: 40px;
    background-image: url("assets/ui/sprint.png");
  }
  #btnCrouch {
    width: 64px; height: 64px;
    right: 28px; bottom: 40px;
    background-image: url("assets/ui/crouch.png");
  }

  /* ---------------- Mobile / small-screen fit ---------------- */
  @media (max-width: 680px), (max-height: 480px) {
    #titlecard h1.imgtitle { width: min(85vw, 320px); max-width: 85vw; }
    #titlecard .sub { font-size: 0.65em; letter-spacing: 0.22em; margin-bottom: 26px; }
    #titlecard .prompt { font-size: 0.8em; padding: 9px 18px; }
    #titlecard .loading-status { font-size: 0.65em; margin-top: 14px; }
    #titlecard .barwrap { width: 70vw; max-width: 260px; }

    #winscreen h1 { font-size: 1.4em; letter-spacing: 0.14em; padding: 0 16px; text-align: center; }
    #winscreen .sub { font-size: 0.72em; max-width: 86vw; padding: 0 16px; }

    #hud { left: 14px; bottom: env(safe-area-inset-bottom, 0px); font-size: 9px; }
    #hud .stamina-bar { width: 90px; }

    #pausehint { font-size: 9px; top: calc(env(safe-area-inset-top, 0px) + 10px); text-align: center; padding: 0 10px; }

    #errorlog { max-width: 60vw; font-size: 9px; right: env(safe-area-inset-right, 8px); }
  }

  /* Touch layout also gets its own pass so the HUD/pause hint never sit
     under the notch or overlap the joystick/buttons, independent of
     screen-size breakpoints above (a touch device can still be large,
     e.g. a tablet). */
  body.is-touch #hud {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 14px);
  }
  body.is-touch #errorlog {
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
  }
  body.is-touch #titlecard .prompt {
    padding: 14px 28px; /* larger tap target than the mouse/keyboard version */
  }

  @media (max-width: 680px) and (orientation: landscape) {
    /* Landscape phones are short — the vertical title stack needs to
       shrink further so the "CLICK TO ENTER" prompt + loading bar don't
       get pushed off the bottom edge. */
    #titlecard h1.imgtitle { width: min(50vw, 240px); max-width: 50vw; }
    #titlecard .sub { margin-bottom: 14px; }
    #titlecard .loading-status { margin-top: 8px; }
    #titlecard .barwrap { margin-top: 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="titlecard">
    <img class="imgtitle" src="assets/ui/misplaced_title.png" alt="MISPLACED" />
    <div class="sub">FLOOR 01 — OFFICE COMPLEX</div>
    <div class="prompt" id="startBtn">CLICK TO ENTER</div>
    <div class="loading-status" id="loadingStatus"></div>
    <div class="barwrap"><div class="barfill" id="loadingBar"></div></div>
  </div>

  <div id="crosshair"></div>
  <div id="vignette"></div>
  <div id="cameraOverlay"></div>
  <div id="pausehint">ESC — Menu &nbsp;|&nbsp; Click to resume</div>

  <div id="hud">
    <div id="fpsLabel">FLOOR 1 // OFFICE COMPLEX</div>
    <div>STAMINA</div>
    <div class="stamina-bar"><div class="stamina-fill" id="staminaFill"></div></div>
  </div>

  <div id="errorlog"></div>
  <div id="interactPrompt"></div>
  <div id="cheatToast"></div>

  <div id="touchControls">
    <div id="touchJoystickZone">
      <div id="joystickBase"></div>
      <div id="joystickKnob"></div>
    </div>
    <div id="touchLookZone"></div>
    <div class="touchBtn" id="btnJump"></div>
    <div class="touchBtn" id="btnSprint"></div>
    <div class="touchBtn" id="btnCrouch"></div>
  </div>

  <div id="winscreen">
    <h1>ACCESS GRANTED</h1>
    <div class="sub">You found the card.<br/>Thanks for playing MISPLACED.</div>
  </div>

  <div id="deathscreen">
    <h1 id="deathTitle">YOU DIED</h1>
    <div class="sub" id="deathSub">Something in the dark found you first.</div>
    <div class="prompt">CLICK TO TRY AGAIN</div>
  </div>

  <div id="fadeOverlay"></div>
  <div id="transitionCard"></div>
</div>

<!-- Three.js via CDN (no npm/bundler) -->
<audio id="menuMusic" src="assets/audio/Menu.mp3" loop preload="auto"></audio>
<audio id="deathSound" src="assets/audio/universfield-body-fall-259680.mp3" preload="auto"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<!-- Game systems, loaded in dependency order -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/assetManager.js"></script>
<script src="js/playerController.js"></script>
<script src="js/lightingSystem.js"></script>
<script src="js/roomTiles.js"></script>
<script src="js/roomStreamer.js"></script>
<script src="js/atmosphereSystem.js"></script>
<script src="js/hotelLobby.js"></script>
<script src="js/hotelCorridor.js"></script>
<script src="js/hotelRooms.js"></script>
<script src="js/hotelStreamer.js"></script>
<script src="js/monsterSystem.js"></script>
<script src="js/floorManager.js"></script>
<script src="js/cheatSystem.js"></script>
<script src="js/main.js"></script>
</body>
</html>
